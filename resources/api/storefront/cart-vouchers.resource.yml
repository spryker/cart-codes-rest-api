resource:
    name: CartVouchers
    shortName: vouchers
    description: 'Manage voucher codes on authenticated customer carts'

    processor: Spryker\Glue\CartCodesRestApi\Api\Storefront\Processor\CartVouchersStorefrontProcessor

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Post
          uriTemplate: '/carts/{cartId}/vouchers'
          uriVariables:
              cartId:
                  toProperty: 'cart'
                  fromClass: CartsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Voucher applied; the updated cart is returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token.'
                  404:
                      description: 'Cart not found (code 101).'
                  422:
                      description: 'Voucher code is blank, unknown, or not applicable to the cart items (code 3302).'
                      codes:
                          - code: '3302'
                            description: 'The voucher code cannot be applied to the cart.'
                          - code: '901'
                            description: 'Request validation failed.'

        - type: Delete
          extraProperties:
              notFoundCode: '101'
              notFoundMessage: 'Cart with given uuid not found.'
          uriTemplate: '/carts/{cartId}/vouchers/{code}'
          read: false
          output: false
          uriVariables:
              cartId:
                  identifiers: [cartId]
              code:
                  identifiers: [code]
          openapiContext:
              responses:
                  204:
                      description: 'Voucher removed from the cart.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token.'
                  404:
                      description: 'Cart not found (code 101).'
                  422:
                      description: 'Voucher code is not applied to the cart (code 3301), or it cannot be removed, for example because the cart is locked (code 3303).'
                      codes:
                          - code: '3301'
                            description: 'The voucher code is not applied to the cart.'
                          - code: '3303'
                            description: 'The voucher code cannot be removed from the cart.'

    properties:
        code:
            type: string
            identifier: true
            writable: true
            readable: true
            required: true
            description: 'Voucher code to apply to the cart'
            openapiContext:
                example: 'HAPPY2024'

        cart:
            type: CartsStorefrontResource
            writable: false
            readable: false
            required: false
