resource:
    name: CartCodes
    shortName: cart-codes
    description: 'Manage cart codes (vouchers and gift cards) on authenticated carts'

    processor: Spryker\Glue\CartCodesRestApi\Api\Storefront\Processor\CartCodesStorefrontProcessor

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Post
          uriTemplate: '/carts/{cartId}/cart-codes'
          uriVariables:
              cartId:
                  toProperty: 'cart'
                  fromClass: CartsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Code applied; the updated cart is returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token.'
                  404:
                      description: 'Cart not found (code 101).'
                  422:
                      description: 'Code is blank, or the code cannot be applied to the cart (code 3302).'

        - type: Delete
          uriTemplate: '/carts/{cartId}/cart-codes/{code}'
          uriVariables:
              cartId:
                  identifiers: [cartId]
              code:
                  identifiers: [code]
          read: false
          output: false
          openapiContext:
              responses:
                  204:
                      description: 'Code removed from the cart.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token.'
                  404:
                      description: 'Cart not found (code 101).'

    properties:
        code:
            type: string
            identifier: true
            writable: true
            readable: true
            required: true
            description: 'Cart code to apply to the cart'
            openapiContext:
                example: 'HAPPY2024'

        cart:
            type: CartsStorefrontResource
            writable: false
            readable: false
            required: false
