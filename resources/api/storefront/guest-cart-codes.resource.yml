resource:
    name: GuestCartCodes
    shortName: cart-codes
    description: 'Manage cart codes (vouchers and gift cards) on guest carts'

    processor: Spryker\Glue\CartCodesRestApi\Api\Storefront\Processor\GuestCartCodesStorefrontProcessor

    operations:
        - type: Post
          uriTemplate: '/guest-carts/{guestCartId}/cart-codes'
          uriVariables:
              guestCartId:
                  toProperty: 'guestCart'
                  fromClass: GuestCartsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Code applied; the updated guest cart is returned.'
                  400:
                      description: 'Anonymous customer unique id header is missing (code 109).'
                  404:
                      description: 'Guest cart not found (code 101).'
                  422:
                      description: 'Code is blank, unknown, or not applicable to the guest cart items (code 3302).'

        - type: Delete
          uriTemplate: '/guest-carts/{guestCartId}/cart-codes/{code}'
          uriVariables:
              guestCartId:
                  identifiers: [guestCartId]
              code:
                  identifiers: [code]
          read: false
          output: false
          openapiContext:
              responses:
                  204:
                      description: 'Code removed from the guest cart.'
                  400:
                      description: 'Anonymous customer unique id header is missing (code 109).'
                  404:
                      description: 'Guest cart not found (code 101).'
                  422:
                      description: 'The code cannot be removed from the guest cart, for example because the guest cart is locked (code 3303).'
                      codes:
                          - code: '3303'
                            description: 'The code cannot be removed from the guest cart.'

    properties:
        code:
            type: string
            identifier: true
            writable: true
            readable: true
            required: true
            description: 'Cart code to apply to the guest cart'
            openapiContext:
                example: 'HAPPY2024'

        guestCart:
            type: GuestCartsStorefrontResource
            writable: false
            readable: false
            required: false
