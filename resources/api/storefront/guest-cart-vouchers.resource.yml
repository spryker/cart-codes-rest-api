resource:
    name: GuestCartVouchers
    shortName: vouchers
    description: 'Manage voucher codes on guest carts'

    processor: Spryker\Glue\CartCodesRestApi\Api\Storefront\Processor\GuestCartVouchersStorefrontProcessor

    operations:
        - type: Post
          uriTemplate: '/guest-carts/{guestCartId}/vouchers'
          uriVariables:
              guestCartId:
                  toProperty: 'guestCart'
                  fromClass: GuestCartsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Voucher applied; the updated guest cart is returned.'
                  400:
                      description: 'Anonymous customer unique id header is missing (code 109).'
                  404:
                      description: 'Guest cart not found (code 101).'
                  422:
                      description: 'Voucher code is blank, unknown, or not applicable to the guest cart items (code 3302).'
                      codes:
                          - code: '3302'
                            description: 'The voucher code cannot be applied to the guest cart.'
                          - code: '901'
                            description: 'Request validation failed.'

        - type: Delete
          uriTemplate: '/guest-carts/{guestCartId}/vouchers/{code}'
          read: false
          output: false
          uriVariables:
              guestCartId:
                  identifiers: [guestCartId]
              code:
                  identifiers: [code]
          openapiContext:
              responses:
                  204:
                      description: 'Voucher removed from the guest cart.'
                  400:
                      description: 'Anonymous customer unique id header is missing (code 109).'
                  404:
                      description: 'Guest cart not found (code 101).'
                  422:
                      description: 'Voucher code is not applied to the guest cart (code 3301), or it cannot be removed, for example because the guest cart is locked (code 3303).'
                      codes:
                          - code: '3301'
                            description: 'The voucher code is not applied to the guest cart.'
                          - code: '3303'
                            description: 'The voucher code cannot be removed from the guest cart.'

    properties:
        code:
            type: string
            identifier: true
            writable: true
            readable: true
            required: true
            description: 'Voucher code to apply to the guest cart'
            openapiContext:
                example: 'HAPPY2024'

        guestCart:
            type: GuestCartsStorefrontResource
            writable: false
            readable: false
            required: false
